name: Verify library
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python 资料库/scripts/library.py verify
      - run: python 资料库/scripts/test_library.py
